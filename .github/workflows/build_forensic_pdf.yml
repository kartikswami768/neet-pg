name: Build forensic test PDF

on:
  push:
    branches: [main]
    paths:
      - "Study Material/Notes/Forensic/forensic_medicine_test_27_sep_2026/**"
      - "scripts/build_forensic_pdf.py"
      - ".github/workflows/build_forensic_pdf.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markdown parser
        run: python -m pip install markdown==3.7

      - name: Build HTML and PDF
        run: |
          python scripts/build_forensic_pdf.py
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --allow-file-access-from-files \
            --print-to-pdf="_pdf_build/forensic_medicine_test_27_sep_2026.pdf" \
            --no-pdf-header-footer \
            "file://\${{ github.workspace }}/_pdf_build/forensic_medicine_test_27_sep_2026.html"

      - name: Verify PDF
        run: |
          test -s "_pdf_build/forensic_medicine_test_27_sep_2026.pdf"
          file "_pdf_build/forensic_medicine_test_27_sep_2026.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: forensic-medicine-test-27-sep-2026-pdf
          path: _pdf_build/forensic_medicine_test_27_sep_2026.pdf
          if-no-files-found: error
          retention-days: 7
