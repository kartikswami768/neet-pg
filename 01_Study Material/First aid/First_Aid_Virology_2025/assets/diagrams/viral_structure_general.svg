<text x="60" y="422" class="t h l">Key structural labels</text>
<text x="70" y="460" class="t m">• Capsid = protein shell around the viral nucleic acid.</text>
<text x="70" y="490" class="t m">• Envelope = lipid bilayer acquired during viral exit from a host membrane; spike/surface proteins are embedded in it.</text>
<text x="70" y="520" class="t m">• Helical capsid = nucleic acid associated with repeating capsid protein subunits in a helix.</text>
<text x="70" y="550" class="t m">• Bacteriophage = head/capsid + collar + sheath/core + base plate + tail fibers.</text>
